<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RDR2 Türkçe Dublaj</title><style>body{font-family:system-ui;margin:0;background:#111;color:#eee}main{max-width:900px;margin:auto;padding:16px}video{width:100%;background:#000;border-radius:12px}button,select{font-size:16px;padding:10px;margin:5px 0;border-radius:9px}.card{background:#1d1d1d;padding:14px;border-radius:12px;margin:12px 0}small{color:#aaa}</style></head><body><main><h1>🎮 RDR2 Türkçe Dublaj V1</h1><div class="card"><video id="v" autoplay playsinline muted></video><button id="s">📷 Kamerayı Başlat</button><button id="x" disabled>⏹ Durdur</button></div><div class="card">Tarama: <select id="i"><option value="1200">1.2 sn</option><option value="1800" selected>1.8 sn</option><option value="2500">2.5 sn</option></select><br>Ses: <select id="m"><option value="auto">Otomatik</option><option value="male1">Erkek 1</option><option value="male2">Erkek 2</option><option value="female">Kadın 1</option></select></div><div class="card"><b>İngilizce:</b><div id="d">—</div><br><b>Türkçe:</b><div id="t">—</div><p id="st">Hazır. TV'deki altyazıyı kameraya göster.</p></div><canvas id="c" style="display:none"></canvas><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const v=document.getElementById('v'),c=document.getElementById('c'),s=document.getElementById('s'),x=document.getElementById('x'),d=document.getElementById('d'),t=document.getElementById('t'),st=document.getElementById('st'),iv=document.getElementById('i'),mode=document.getElementById('m');let stream,timer,busy=false,last='',spoken='',voices=[];speechSynthesis.onvoiceschanged=()=>voices=speechSynthesis.getVoices();voices=speechSynthesis.getVoices();
function voice(){let q=voices.filter(v=>/^tr/i.test(v.lang));if(!q.length)return voices[0];if(mode.value==='female')return q[1]||q[0];if(mode.value==='male2')return q[2]||q[1]||q[0];return q[0]}
async function tr(q){let u='https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=tr&dt=t&q='+encodeURIComponent(q),r=await fetch(u);let a=await r.json();return (a[0]||[]).map(z=>z[0]).join('')}
function say(q){if(!q||q===spoken)return;spoken=q;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q);u.lang='tr-TR';u.rate=1.02;let z=voice();if(z)u.voice=z;speechSynthesis.speak(u)}
async function scan(){if(busy||!stream)return;busy=true;try{let w=v.videoWidth,h=v.videoHeight;if(!w||!h){busy=false;return}let y=Math.floor(h*.58),hh=Math.floor(h*.38);c.width=w;c.height=hh;c.getContext('2d').drawImage(v,0,y,w,hh,0,0,w,hh);st.textContent='Altyazı taranıyor…';let r=await Tesseract.recognize(c,'eng');let q=r.data.text.replace(/\s+/g,' ').trim();if(q.length<3||q===last){busy=false;return}last=q;d.textContent=q;st.textContent='Türkçeye çevriliyor…';let z=(await tr(q)).trim();t.textContent=z;say(z);st.textContent='Hazır — yeni altyazı bekleniyor.'}catch(e){st.textContent='Bekleniyor: '+e.message}busy=false}
s.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;s.disabled=true;x.disabled=false;timer=setInterval(scan,+iv.value);scan()}catch(e){st.textContent='Kamera izni verilemedi: '+e.message}}
x.onclick=()=>{if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(z=>z.stop());stream=null;v.srcObject=null;s.disabled=false;x.disabled=true;speechSynthesis.cancel();st.textContent='Durduruldu.'}
</script></main></body></html>
